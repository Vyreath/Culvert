<div class="toast-container" id="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>
<script src="/js/modules/api.js"></script>
<script src="/js/modules/auth.js"></script>
<script src="/js/modules/toast.js"></script>
<script src="/js/modules/modal.js"></script>
<script src="/js/modules/app.js"></script>
<script>
  proj4.defs("EPSG:32717","+proj=utm +zone=17 +south +datum=WGS84 +units=m +no_defs");

  async function initMap() {
    const map = L.map('map').setView([-1.5, -78.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    try {
      const data = await API.getMapaPuntos({});
      if (!data.features || !data.features.length) {
        Toast.info('No hay puntos con coordenadas para mostrar');
        return;
      }

      const markers = [];
      data.features.forEach(f => {
        let lng, lat;
        const proj = f.properties?.projection || 'wgs84';

        if (proj === 'utm') {
          const [este, norte] = f.geometry.coordinates;
          const transformed = proj4('EPSG:32717', 'EPSG:4326', [este, norte]);
          lng = transformed[0];
          lat = transformed[1];
        } else {
          // WGS84 directo [lng, lat]
          lng = f.geometry.coordinates[0];
          lat = f.geometry.coordinates[1];
        }

        const marker = L.marker([lat, lng]).addTo(map).bindPopup(
          `<strong>Ficha ${f.properties.ficha}</strong><br>${f.properties.ubicacion || ''}`
        );
        markers.push(marker);
      });

      if (markers.length) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds(), { padding: [30, 30] });
      }
    } catch (err) {
      Toast.error('Error cargando puntos del mapa: ' + err.message);
    }
  }

  document.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
